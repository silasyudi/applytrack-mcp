spring:
  application:
    name: applytrack-mcp
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        name: applytrack-mcp
        version: @project.version@
        stdio: true

# No stdio, o stdout é só do protocolo MCP: os logs vão para arquivo
logging:
  threshold:
    console: off
  file:
    name: ${user.home}/.applytrack-mcp/applytrack-mcp.log


# Padrão: DynamoDB Local do compose.yaml
applytrack:
  dynamodb:
    endpoint: http://localhost:8000
    region: us-east-1
    table-name: job-applications
    create-table: true
