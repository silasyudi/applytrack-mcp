spring:
  application:
    name: applytrack-mcp
  main:
    web-application-type: none
    banner-mode: off
  ai:
    mcp:
      server:
        name: applytrack-mcp
        version: 0.0.1
        stdio: true

# No stdio, o stdout é só do protocolo MCP: os logs vão para arquivo
logging:
  threshold:
    console: off
  file:
    name: ${user.home}/.applytrack-mcp/applytrack-mcp.log
